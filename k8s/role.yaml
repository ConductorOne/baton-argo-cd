apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baton-argo-cd
  namespace: argocd
  labels:
    app: baton-argo-cd
rules:
  # Permissions to read and modify Argo CD ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "patch", "update"]
  # Permissions to purge a deprovisioned account's stored credentials
  # (accounts.<name>.password / .passwordMtime / .tokens) from argocd-secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]

